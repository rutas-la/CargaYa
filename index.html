<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16181c">
<title>CargaYa · Mercado Mayor de Coche</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --ink:#16181c; --ink2:#4a4f58; --mute:#8a9099; --line:#e2e0d8; --bg:#f6f4ee; --card:#fff;
  --yel:#ffc400; --yel2:#fff3c4; --grn:#12a150; --grn2:#dcf5e6; --red:#e0362c; --red2:#fde3e1;
  --blu:#1f6feb; --blu2:#e0ecff; --org:#f07b14; --org2:#ffe9d6;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;letter-spacing:.2px;margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
header{background:var(--ink);color:#fff;padding:14px 18px 0;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:36px;height:36px;border-radius:9px;background:var(--yel);display:grid;place-items:center;color:var(--ink);font-family:"Barlow Condensed";font-weight:800;font-size:20px}
.logo h1{font-size:24px;line-height:1}
.logo small{display:block;color:#b9bcc2;font-size:12.5px;font-family:Barlow;font-weight:500}
.geo{font-size:12.5px;color:#cfd2d6;display:flex;align-items:center;gap:6px}
.geo i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{background:none;border:0;color:#b9bcc2;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--yel)}
main{max-width:1180px;margin:0 auto;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.35fr 1fr}
@media(max-width:880px){.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:21px;margin-bottom:4px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 6px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:880px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{font-family:"Barlow Condensed";font-size:32px;display:block;line-height:1.05}
.kpi span{font-size:13px;color:var(--ink2)}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700;background:var(--ink);color:#fff}
.btn.y{background:var(--yel);color:var(--ink)}
.btn.g{background:var(--grn)}
.btn.o{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.big{width:100%;padding:16px;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-pendiente{background:#eceae3;color:var(--ink2)}
.st-asignado{background:var(--blu2);color:var(--blu)}
.st-en_ruta{background:var(--org2);color:#b35200}
.st-en_vehiculo{background:var(--yel2);color:#8a6500}
.st-entregado{background:var(--grn2);color:#0b7a3c}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .meta{font-size:13.5px;color:var(--ink2)}
.plate{font-family:"Share Tech Mono",monospace;background:var(--ink);color:var(--yel);padding:2px 8px;border-radius:6px;font-size:14px;letter-spacing:1px}
.loc{font-family:"Barlow Condensed";font-weight:700}
.timeline{display:flex;gap:4px;margin-top:2px}
.timeline i{flex:1;height:5px;border-radius:3px;background:#eceae3}
.timeline i.on{background:var(--grn)}
.mapwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow:hidden}
svg.map{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:6px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hint{font-size:13px;color:var(--mute)}
.ok{color:var(--grn);font-weight:700}
.bad{color:var(--red);font-weight:700}
.found{background:var(--grn2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.notfound{background:var(--red2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block;background:#eceae3}
.photo.sm{width:96px;height:72px}
.carbox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.dist{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;margin-top:12px}
.dist b{font-family:"Barlow Condensed";font-size:40px;line-height:1}
.dist .arrow{width:52px;height:52px;border-radius:50%;background:var(--yel);display:grid;place-items:center;flex:0 0 52px}
.dist .arrow svg{transition:transform .3s}
.demo{background:#eef3ff;border:1px dashed #9db8f5;border-radius:10px;padding:10px;margin-top:10px;font-size:13.5px}
.demo input[type=range]{padding:0;border:0}
.notif{border-left:4px solid var(--org);background:var(--org2);border-radius:10px;padding:10px 12px;font-size:14.5px}
.trip{border:2px solid var(--ink);border-radius:16px;padding:16px;background:#fff}
.trip .dest{font-family:"Barlow Condensed";font-size:34px;line-height:1.05;font-weight:800}
.steps{display:grid;gap:10px;margin-top:12px}
.stepbox{border:1px dashed var(--line);border-radius:12px;padding:12px}
.stepbox.done{border-style:solid;border-color:var(--grn);background:var(--grn2)}
.stepbox h3{font-size:18px}
.log{font-size:13.5px;max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.log div{border-left:3px solid var(--line);padding-left:8px}
.log time{color:var(--mute);font-family:"Share Tech Mono";font-size:12px;margin-right:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:.25s;z-index:50;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.pin{font-family:"Share Tech Mono";font-size:34px;letter-spacing:8px;background:var(--yel2);border-radius:10px;padding:6px 12px;display:inline-block}
.seg{display:flex;background:#eceae3;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.hidden{display:none!important}
.route{stroke-dasharray:10 8;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.pulse{animation:pu 1.2s ease-in-out infinite}
@keyframes pu{50%{opacity:.25}}
.empty{color:var(--mute);text-align:center;padding:22px 8px;font-size:14.5px}
footer{max-width:1180px;margin:0 auto;padding:0 18px 30px;color:var(--mute);font-size:12.5px}
.geo i{display:inline-block}
#nav:empty{display:none}

.scan{position:fixed;inset:0;background:rgba(10,11,13,.94);z-index:100;display:grid;place-items:center;padding:16px}
.scanbox{width:min(460px,100%);color:#fff}
.scanbox h2{color:#fff}
.scanvid{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;margin-top:10px}
.scanvid video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:18%;border:4px solid var(--yel);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
#print{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .hoja-fichas{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .ficha{height:69mm;border:1px dashed #999;padding:4mm;display:grid;grid-template-columns:30mm 1fr;grid-template-rows:auto auto 1fr;column-gap:4mm;break-inside:avoid;font-family:Barlow,Arial,sans-serif}
  .ficha .fh{grid-column:1/3;font-size:11pt}
  .ficha .fn{grid-column:1/3;font-family:'Barlow Condensed',Arial;font-weight:800;font-size:24pt;line-height:1}
  .ficha img{width:30mm;height:30mm;grid-row:3/5}
  .ficha .fc{grid-column:1;font-size:8pt;color:#555;text-align:center}
  .ficha .fl{grid-column:2;font-size:12pt;margin:.8mm 0}
  .ficha .fp{grid-column:1/3;font-size:8pt;color:#333;align-self:end}
  .hoja-carnets{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
  .carnet{height:50mm;border:1px solid #333;border-radius:3mm;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;align-items:center;padding:3mm 4mm;column-gap:4mm;break-inside:avoid;font-family:Barlow,Arial,sans-serif}
  .carnet .cn{grid-column:2;font-family:'Barlow Condensed',Arial;font-weight:800;font-size:44pt;line-height:1}
  .carnet img{grid-row:1/3;width:40mm;height:40mm}
  .carnet .ct{grid-column:2;font-weight:700;font-size:13pt}
  .carnet .ct span{font-weight:400;font-size:9pt}
  .cartel{height:270mm;display:flex;flex-direction:column;align-items:center;justify-content:center;break-after:page;font-family:'Barlow Condensed',Arial;border:6mm solid #12a150;border-radius:8mm}
  .cartel .cz{font-size:80pt;font-weight:800;color:#12a150;line-height:1}
  .cartel .cn2{font-size:330pt;font-weight:800;line-height:.95}
  .cartel .cb{font-size:20pt;color:#555;font-family:Barlow,Arial}
}
</style>

<body>
<header>
  <div class="brand">
    <div class="logo"><div class="logo-mark">C</div><div><h1>CargaYa</h1><small>Mercado Mayor de Coche · Caracas</small></div></div>
    <div class="geo" id="estado"></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<footer>CargaYa · versión piloto</footer>
<div class="toast" id="toast"></div>
<div id="print"></div>
<script>
/* =====================================================================
   CargaYa · versión piloto
   - Datos compartidos en tiempo real con Supabase (config.js)
   - Sin config.js completo funciona en "modo local" (solo este teléfono)
   ===================================================================== */
const CFG=Object.assign({RADIO_ZONA_M:60,SUPABASE_URL:'',SUPABASE_KEY:'',CLAVE_ADMIN:'1234',GEOCERCA_ACTIVA:true,RADIO_GEOCERCA_M:800,DISTANCIA_ENTREGA_M:30},window.CARGAYA_CONFIG||{});
const ONLINE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY&&window.supabase);
const sb=ONLINE?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY):null;

/* ===================== Plano y geolocalización ===================== */
// Plano trazado sobre la vista satelital (norte arriba). Escala aprox: 0,7 m por unidad.
// Ancla: estación Metro Mercado (L3) 10.439694, -66.926833 en el punto (905,465) del plano.
const M_PX=0.7, ANCLA={x:905,y:465,lat:10.439694,lng:-66.926833};
function toLatLng(x,y){return {lat:ANCLA.lat-(y-ANCLA.y)*M_PX/110574,lng:ANCLA.lng+(x-ANCLA.x)*M_PX/109477}}
function fromLatLng(lat,lng){return {x:ANCLA.x+(lng-ANCLA.lng)*109477/M_PX,y:ANCLA.y-(lat-ANCLA.lat)*110574/M_PX}}
const CENTRO=toLatLng(520,400);
function distM(a,b){const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function rumbo(a,b){const r=Math.PI/180,y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);const g=(Math.atan2(y,x)/r+360)%360;return {g,txt:['norte','noreste','este','sureste','sur','suroeste','oeste','noroeste'][Math.round(g/45)%8]}}
const dentroMercado=f=>!CFG.GEOCERCA_ACTIVA||distM(f,CENTRO)<=CFG.RADIO_GEOCERCA_M;
const enPlano=f=>f&&f.lat!=null&&distM(f,CENTRO)<=1500;
const ANG=-61;
function rot(cx,cy,ang,lx,ly){const a=ang*Math.PI/180;return [cx+lx*Math.cos(a)-ly*Math.sin(a),cy+lx*Math.sin(a)+ly*Math.cos(a)]}
const VZ={cx:456,cy:474,w:270,h:118,N:[529,343],S:[383,605]};
const VPOLY=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>rot(VZ.cx,VZ.cy,ANG,a*VZ.w/2,b*VZ.h/2));
const GEO=[[235,85],[905,68],[995,330],[905,560],[740,710],[300,705],[60,650],[60,440],[200,330]];
const AREAS=[
  {id:'NE',nombre:'Estacionamiento Noreste',poly:[[712,205],[800,172],[905,330],[805,388],[715,352]],salida:'N',via:[[600,338],[700,348]]},
  {id:'SO',nombre:'Estacionamiento Suroeste',poly:[[70,480],[160,440],[290,595],[240,640],[90,590]],salida:'S',via:[[300,628]]},
  {id:'ZEA',nombre:'Frente al Galpón Calle Zea',poly:[[532,218],[610,216],[602,290],[540,282]],salida:'N',via:[[585,300]]},
];
const EDIF=[
  {n:'Galpón norte',p:'335,95 482,92 382,388 250,332',l:[365,235],r:-61},
  {n:'Galpón Calle Zea',p:'500,104 772,104 772,206 520,216',l:[640,162],r:0},
  {n:'Barco Pesca',p:'612,214 706,236 682,336 600,316',l:[645,300],r:0},
  {n:'Agua Viva',p:'402,214 470,206 530,248 520,346 398,312',l:[462,286],r:-61},
  {n:'Nave Cate',p:'382,330 432,346 332,588 276,562',l:[318,500],r:-61},
  {n:'INMERCA',p:'602,344 652,360 500,652 446,630',l:[548,500],r:-61},
];
const HITOS=[{n:'Barco Pesca',x:655,y:275},{n:'el Galpón Calle Zea',x:640,y:160},{n:'INMERCA',x:548,y:500},{n:'la Nave Cate',x:352,y:460},{n:'Agua Viva',x:462,y:280},{n:'el Hospital',x:930,y:180},{n:'el Metro Mercado',x:905,y:465},{n:'el Galpón norte',x:340,y:230},{n:'los puestos',x:670,y:540}];
function pip(x,y,poly){let a=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)a=!a}return a}
const areaOf=(x,y)=>AREAS.find(a=>pip(x,y,a.poly))||(pip(x,y,VPOLY)?{id:'V',nombre:'Zona de camiones vendedores',via:[]}:null);
function zonaDe(f){if(!f||f.lat==null)return null;let best=null;Object.values(S.zona).forEach(z=>{if(z.lat==null||z.baja)return;const d=distM(f,z);if(!best||d<best.d)best={z,d}});return best&&best.d<=CFG.RADIO_ZONA_M?best:null}
function lugar(f){if(!f||f.lat==null)return {zona:'Sin ubicación',cerca:''};const zz=zonaDe(f);if(zz)return {zona:'Zona '+zz.z.nombre,cerca:`a ${Math.round(zz.d)} m del cartel`,codigo:zz.z.nombre};if(!enPlano(f))return {zona:'Fuera del mercado (prueba)',cerca:`${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}`};
  const {x,y}=fromLatLng(f.lat,f.lng);const a=areaOf(x,y);const h=HITOS.reduce((b,h)=>Math.hypot(h.x-x,h.y-y)<Math.hypot(b.x-x,b.y-y)?h:b);
  return {zona:a?a.nombre:'Dentro del mercado',cerca:'cerca de '+h.n}}
function locTxt(f){const l=lugar(f);return l.cerca?`${l.zona} · ${l.cerca}`:l.zona}
const f1=n=>Math.round(n*10)/10;
const XY=f=>{const p=fromLatLng(f.lat,f.lng);return [p.x,p.y]};

/* ===================== GPS del teléfono ===================== */
function errGPS(e){return e&&e.code===1?'Le negaste el permiso de ubicación a la página. Actívalo en los ajustes del navegador (candado junto a la dirección) y prueba de nuevo.':e&&e.code===3?'El GPS tardó demasiado. Prueba al aire libre, lejos de techos.':(e&&e.message)||'No se pudo leer el GPS.'}
function mejorFix(ms=12000){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej(new Error('Este teléfono o navegador no permite usar el GPS.'));
  let best=null,done=false;const fin=()=>{if(done)return;done=true;clearTimeout(t);navigator.geolocation.clearWatch(w);best?res(best):rej(new Error('No se obtuvo señal GPS. Prueba al aire libre.'))};
  const w=navigator.geolocation.watchPosition(p=>{const f={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};if(!best||f.acc<best.acc)best=f;if(best.acc<=8)fin()},
    e=>{if(!best&&!done){done=true;clearTimeout(t);navigator.geolocation.clearWatch(w);rej(e)}},{enableHighAccuracy:true,maximumAge:0,timeout:ms});
  const t=setTimeout(fin,ms)})}

/* ===================== Datos ===================== */
const S={vendedor:{},comprador:{},carretillero:{},despacho:{},calibracion:{},zona:{},log:[]};
let conexion=ONLINE?'conectando':'local';
const LKEY='cargaya-piloto-local',QKEY='cargaya-piloto-cola',MEKEY='cargaya-piloto-yo';
let ME=null;try{ME=JSON.parse(localStorage.getItem(MEKEY)||'null')}catch(e){}
function setME(m){ME=m;try{m?localStorage.setItem(MEKEY,JSON.stringify(m)):localStorage.removeItem(MEKEY)}catch(e){}}
let cola=[];try{cola=JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){}
const saveCola=()=>{try{localStorage.setItem(QKEY,JSON.stringify(cola))}catch(e){}};
function saveLocal(){if(ONLINE)return;try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}

async function cargar(){
  if(!ONLINE){try{Object.assign(S,JSON.parse(localStorage.getItem(LKEY)||'{}'))}catch(e){}return}
  const r=await sb.from('registros').select('tipo,id,data');
  if(r.error){conexion='error';toast('No se pudo conectar con la base de datos');return}
  r.data.forEach(x=>{if(S[x.tipo])S[x.tipo][x.id]=x.data});
  const a=await sb.from('actividad').select('t,m').order('id',{ascending:false}).limit(80);
  if(!a.error)S.log=a.data.map(l=>({t:Date.parse(l.t),m:l.m}));
  sb.channel('cargaya').on('postgres_changes',{event:'*',schema:'public',table:'registros'},p=>{const x=p.new;if(!x||!x.tipo||!S[x.tipo])return;const antes=S[x.tipo][x.id];S[x.tipo][x.id]=x.data;avisar(x.tipo,antes,x.data);pedirRender()})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'actividad'},p=>{S.log.unshift({t:Date.parse(p.new.t),m:p.new.m});S.log=S.log.slice(0,80);pedirRender()})
    .subscribe(st=>{conexion=st==='SUBSCRIBED'?'en línea':st==='CLOSED'||st==='CHANNEL_ERROR'||st==='TIMED_OUT'?'sin conexión':conexion;pintarEstado()});
}
async function enviar(op){if(op.k==='r')return sb.from('registros').upsert({tipo:op.tipo,id:op.obj.id,data:op.obj,updated_at:new Date().toISOString()});return sb.from('actividad').insert({m:op.m})}
async function vaciarCola(){if(!ONLINE||!cola.length)return;while(cola.length){let r;try{r=await enviar(cola[0])}catch(e){r={error:e}}if(r&&r.error){conexion='sin conexión';pintarEstado();return}cola.shift();saveCola()}pintarEstado()}

const BASE=location.origin+location.pathname.replace(/index\.html$/,'');
const urlFicha=(num,cod)=>`${BASE}?f=${num}-${cod}`;
const urlCarnet=num=>`${BASE}?k=${num}`;
const pad=(n,l)=>String(n).padStart(l,'0');
function parseCodigo(txt){if(!txt)return null;txt=String(txt).trim();
  try{const u=new URL(txt);const f=u.searchParams.get('f'),k=u.searchParams.get('k');if(f)return parseCodigo('F:'+f);if(k)return parseCodigo('K:'+k)}catch(e){}
  let m=txt.match(/^F:?\s*(\d{1,6})(?:[-\s]+([A-Z0-9]{3}))?$/i);if(m)return {tipo:'f',num:pad(m[1],4),cod:m[2]?m[2].toUpperCase():null};
  m=txt.match(/^K:?\s*(\d{1,4})$/i);if(m)return {tipo:'k',num:pad(m[1],2)};return null}
const carrPorNum=num=>L('carretillero').find(k=>k.num===num);

/* ===================== Escáner con la cámara ===================== */
function cargarJsQR(){return window.jsQR?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='lib/jsQR.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function escanear(titulo,ayuda){return new Promise(async res=>{
  const ov=document.createElement('div');ov.className='scan';
  ov.innerHTML=`<div class="scanbox"><h2>${esc(titulo)}</h2><p class="sub" style="color:#cfd2d6">${esc(ayuda||'Apunta la cámara al código QR')}</p>
   <div class="scanvid"><video playsinline muted></video><div class="scanframe"></div></div><p class="hint" id="scanMsg" style="color:#cfd2d6">Abriendo la cámara…</p>
   <button class="btn o" id="scanCancel" style="width:100%;margin-top:8px">Cancelar</button></div>`;
  document.body.appendChild(ov);const video=ov.querySelector('video');let stream=null,done=false,timer=null;
  const fin=v=>{if(done)return;done=true;clearInterval(timer);try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}ov.remove();res(v)};
  ov.querySelector('#scanCancel').onclick=()=>fin(null);
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;await video.play();ov.querySelector('#scanMsg').textContent='Buscando el código…'}
  catch(e){ov.querySelector('#scanMsg').textContent='No se pudo abrir la cámara. Revisa el permiso de cámara o escribe el número a mano.';return}
  let det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']})}catch(e){}
  if(!det){try{await cargarJsQR()}catch(e){}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  timer=setInterval(async()=>{if(done||video.readyState<2)return;try{
    if(det){const r=await det.detect(video);if(r&&r[0]){sonar();fin(r[0].rawValue)}return}
    if(window.jsQR){const w=video.videoWidth,h=video.videoHeight,sc=Math.min(1,640/Math.max(w,h));cv.width=w*sc;cv.height=h*sc;cx.drawImage(video,0,0,cv.width,cv.height);
      const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r&&r.data){sonar();fin(r.data)}}}catch(e){}},250)})}

const formSucio=()=>[...document.querySelectorAll('#app input:not([type=file]):not([type=range]),#app textarea')].some(i=>i.value!==i.defaultValue);
const ocupado=()=>!!(reg&&reg.ocupado)||!!corrigiendo||!!calMidiendo||!!zonaMidiendo||!!document.querySelector('.scan')||!!fichaVista||!!desp.k||!!desp.f||formSucio();
function pintarEstado(){const el=document.getElementById('estado');if(!el)return;const col={'en línea':'#3ddc84','local':'#ffc400','conectando':'#9aa0a8'}[conexion]||'#e0362c';
  el.innerHTML=`<i style="background:${col}"></i>${conexion==='local'?'Modo local (solo este teléfono)':conexion==='en línea'?'En línea':conexion==='conectando'?'Conectando…':'Sin conexión: se guarda y se envía al volver la señal'}${cola.length?` · ${cola.length} por enviar`:''}${ME?` · ${esc(ME.nombre)} <a href="#" id="salir" style="color:#ffc400">cambiar</a>`:''}`;
  const s=document.getElementById('salir');if(s)s.onclick=e=>{e.preventDefault();setME(null);view=null;render()}}
function render(){
  const vs=vistasDe();if(ME&&!vs.includes(view))view=vs[0];
  const nav=document.getElementById('nav');nav.innerHTML=vs.length>1?vs.map(v=>`<button data-v="${v}" class="${v===view?'on':''}">${NOMBRES[v]}</button>`).join(''):'';
  nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;render()};
  pintarEstado();
  const app=document.getElementById('app');
  if(fichaURL){app.innerHTML=vFichaURL();bindFichaURL();return}
  if(!ME){app.innerHTML=vInicio();bind.inicio();return}
  if(!cargado){app.innerHTML='<div class="card empty">Cargando datos…</div>';return}
  app.innerHTML=({mercado:vMercado,zonas:vZonas,carretilleros:vCarretilleros,imprimir:vImprimir,calibrar:vCalibrar,vendedor:vVendedor,comprador:vComprador})[view]();
  bind[view]&&bind[view]();
}
function itemDesp(d,who){const v=vend(d.vendedor),c=comp(d.placa),k=carr(d.carretillero);

   <div class="meta">${who!=='vendedor'?`De <b>${esc(v?v.nombre:d.vendedor)}</b> · `:''}${who!=='comprador'&&c?`Para <span class="plate">${esc(d.placa)}</span> <span class="loc">${esc(lugar(c).zona)}</span> · `:''}${k?`Carretillero <b>#${esc(k.num)}</b> ${esc(k.nombre||'')}`:'Sin carretillero'}</div>
   ${tl(d)}<div class="meta">Salió ${hhmm(d.t.creado)}${d.t.entregado?` · Recibido ${hhmm(d.t.entregado)} (${Math.max(1,Math.round((d.t.entregado-d.t.creado)/60000))} min)`:''}${d.estado==='entregado'?` · ✓ ${{ficha:'el comprador escaneó la ficha',boton:'confirmó el comprador (sin escanear)',vendedor:'confirmado por el vendedor'}[d.verif?.metodo]||''}`:''}${d.estado==='reclamo'?` · ⚠ ${esc(d.reclamo||'falta mercancía')}`:''}</div></div>`}

let fichaURL=null,kURL=null;
try{const sp=new URLSearchParams(location.search);const f=sp.get('f'),k=sp.get('k');if(f)fichaURL=parseCodigo('F:'+f);if(k)kURL=parseCodigo('K:'+k)}catch(e){}
function despDeFicha(p){return L('despacho').filter(d=>d.ficha&&d.ficha.num===p.num&&(!d.ficha.cod||!p.cod||d.ficha.cod===p.cod)).sort((a,b)=>b.t.creado-a.t.creado)[0]}
function vFichaURL(){const p=fichaURL;const d=despDeFicha(p);
  const cerrar='<button class="btn o" id="fuCerrar" style="width:100%;margin-top:10px">Ir a la app</button>';
  if(!cargado)return `<div class="card empty">Buscando la ficha ${esc(p.num)}…</div>`;
  if(!d)return `<div class="card" style="max-width:520px;margin:0 auto"><h2>Ficha ${esc(p.num)}</h2><p class="sub">Esta ficha todavía no está asociada a ningún despacho.</p>${cerrar}</div>`;
  const v=vend(d.vendedor),k=carr(d.carretillero);
  const esMio=ME&&ME.rol==='comprador'&&ME.id===d.placa;
  return `<div class="card" style="max-width:520px;margin:0 auto"><h2>Ficha ${esc(p.num)}</h2>
   <div class="item" style="margin-top:8px"><div class="top"><b>${esc(d.desc)} · ${d.bultos} bultos</b>${chip(d.estado)}</div>
    <div class="meta">De <b>${esc(v?.nombre||'')}</b> · Para <span class="plate">${esc(d.placa)}</span>${k?` · Carretillero #${esc(k.num)} ${esc(k.nombre||'')}`:''}</div></div>
   ${d.estado==='en_ruta'?(esMio?`<p class="sub" style="margin-top:12px">Revisa la mercancía y confirma.</p>
      <button class="btn g big" id="fuOk">Recibí ${d.bultos} bultos completos</button>
      <label>¿Falta algo? Escribe qué</label><input id="fuRecl" placeholder="Ej: llegaron 5 bultos, faltó 1"><button class="btn o" id="fuMal" style="width:100%;margin-top:8px">Reportar faltante</button>`
      :`<div class="notfound" style="margin-top:12px">${ME&&ME.rol==='comprador'?`Esta ficha es para el vehículo ${esc(d.placa)}, no para el tuyo (${esc(ME.id)}).`:`Para confirmar, entra a la app como comprador con la placa ${esc(d.placa)} y vuelve a escanear la ficha.`}</div>`)
    :`<div class="found" style="margin-top:12px">${d.estado==='entregado'?`Ya fue recibida a las ${hhmm(d.t.entregado)}.`:'Tiene un reclamo registrado.'}</div>`}${cerrar}</div>`}
function bindFichaURL(){const salir=()=>{fichaURL=null;try{history.replaceState(null,'',location.pathname)}catch(e){}render()};
  if($('fuCerrar'))$('fuCerrar').onclick=salir;
  const d=despDeFicha(fichaURL);
  if($('fuOk'))$('fuOk').onclick=async()=>{await confirmar(d,'ficha');salir()};
  if($('fuMal'))$('fuMal').onclick=async()=>{await reclamar(d,$('fuRecl').value.trim());salir()}}
async function confirmar(d,metodo){await guardar('despacho',{...d,estado:'entregado',t:{...d.t,entregado:Date.now()},verif:{metodo}});log(`Ficha ${d.ficha?.num||d.id} recibida en ${d.placa} (${metodo==='ficha'?'escaneó la ficha':metodo==='boton'?'confirmó sin escanear':'lo confirmó el vendedor'})`);toast('Recepción confirmada ✓')}
async function reclamar(d,txt){await guardar('despacho',{...d,estado:'reclamo',reclamo:txt||'falta mercancía',t:{...d.t,reclamo:Date.now()}});log(`⚠ ${d.placa} reportó un faltante en la ficha ${d.ficha?.num||d.id}: ${txt||'sin detalle'}`);toast('Se avisó al vendedor')}

function cargarQRlib(){return window.qrcode?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='lib/qrcode.js';s.onload=res;s.onerror=()=>{toast('No se pudo cargar el generador de QR. Revisa la conexión.');rej()};document.head.appendChild(s)})}
function qrImg(txt,px){const q=qrcode(0,'M');q.addData(txt);q.make();const n=q.getModuleCount();return q.createDataURL(Math.max(2,Math.floor(px/(n+4))),2)}
const COD_ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codFicha(n){let x=(n*2654435761+0x9E3779B9)>>>0,s='';for(let i=0;i<3;i++){s+=COD_ALF[x%COD_ALF.length];x=(Math.floor(x/COD_ALF.length)^((x<<7)>>>0))>>>0}return s}
async function imprimir(html){const pa=document.getElementById('print');pa.innerHTML=html;await new Promise(r=>setTimeout(r,300));window.print()}

  const enCamino=mis.filter(d=>d.estado==='en_ruta');const l=lugar(c);
  return `<div class="grid g2"><div class="grid" style="align-content:start">
   <div class="card"><h2>Mi vehículo</h2>
    <div class="carbox" style="margin-top:6px">${c.foto?`<img class="photo sm" src="${c.foto}" alt="Foto del vehículo">`:'<div class="photo sm" style="display:grid;place-items:center;color:#8a9099;font-size:12px">Sin foto</div>'}
     <div><span class="plate">${esc(c.id)}</span> ${esc(c.vehiculo)}<div class="loc" style="font-size:${l.codigo?34:20}px;margin-top:4px">${esc(l.zona)}</div><div class="meta">${esc(l.cerca)}${c.ref?' · '+esc(c.ref):''}</div>
     <div class="hint">GPS ±${c.acc} m · marcado ${hhmm(c.gpsT)}</div></div></div>
    ${l.codigo?'':'<div class="nota" style="background:#fff3c4;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px">No hay un cartel de zona cerca. Dile al vendedor una referencia clara.</div>'}
    ${corrigiendo?`<div class="found" style="margin-top:10px">Toca en el mapa el lugar exacto donde está tu vehículo.</div><div style="margin-top:8px">${mapSVG({id:'pick',pick:true,pin:corrigiendo,skip:c.id,zoom:[XY(corrigiendo)],minW:480})}</div>
      <div class="row" style="margin-top:10px"><button class="btn o" id="cancelCorr">Cancelar</button><button class="btn y" id="okCorr">Guardar ubicación</button></div>`
     :`<div class="row" style="margin-top:12px"><button class="btn o" id="regps">📍 Estoy junto al vehículo: actualizar GPS</button>${enPlano(c)?'<button class="btn o" id="corr">Corregir en el mapa</button>':''}</div><div id="cRes"></div>`}
    ${ME.rol==='comprador'?'<div style="margin-top:12px"><button class="btn o" id="meVoy" style="width:100%">Ya me fui del mercado</button></div>':''}</div>
   <div class="card" style="${enCamino.length?'border:2px solid var(--yel)':''}"><h2>Recibir mercancía</h2>
    <p class="sub">Cada carga llega con una <b>ficha de papel</b>. Escanéala para confirmar que la recibiste.</p>
    <button class="btn y big" id="cScanF">📷 Escanear ficha</button>
    ${enCamino.map(d=>{const k=carr(d.carretillero);return `<div class="item" style="margin-top:10px"><div class="top"><b>${d.ficha?'Ficha '+esc(d.ficha.num)+' · ':''}${esc(d.desc)} · ${d.bultos} bultos</b>${chip(d.estado)}</div>
      <div class="meta">De ${esc(vend(d.vendedor)?.nombre||'')} · salió ${hhmm(d.t.creado)}${k?` · carretillero #${esc(k.num)}`:''}</div>
      <div class="row"><button class="btn o" data-sinf="${esc(d.id)}">Recibí (no tengo la ficha)</button><button class="btn o" style="flex:0 0 auto" data-recl="${esc(d.id)}">Falta algo</button></div></div>`}).join('')}</div></div>
  <div class="card"><h2>Mis compras</h2><p class="sub">${enCamino.length} por recibir · ${mis.length-enCamino.length} cerradas</p>
   <div class="list">${mis.map(d=>`${itemDesp(d,'comprador')}${d.estado!=='entregado'&&vend(d.vendedor)?.tel?waBtn(vend(d.vendedor).tel,'Escribir al vendedor'):''}`).join('')||'<div class="empty">Cuando un vendedor despache a tu placa, lo vas a ver aquí</div>'}</div></div></div>`}
function vRegistro(c){
  const r=reg||(reg={veh:c?.vehiculo||'',ref:c?.ref||'',foto:c?.foto||null});
  return `<div class="grid g2"><div class="card">
   <h2>Llegué y estacioné</h2><p class="sub">Antes de alejarte del vehículo, guarda su ubicación. Así el vendedor le dice al carretillero a qué zona ir.</p>
   <form id="fReg"><div class="found"><span class="plate">${esc(ME.id)}</span> ${esc(ME.nombre)}</div>
    <label>Vehículo (tipo y color)</label><input id="rVeh" placeholder="Ej: Camión 350 blanco" value="${esc(r.veh)}" required>
    <label>Referencia (opcional)</label><input id="rRef" placeholder="Ej: detrás del camión cava azul" value="${esc(r.ref)}">
    <label>Foto del vehículo y lo que lo rodea</label>
    <div class="row"><label class="btn o" style="margin:0;text-align:center">${r.foto?'Cambiar foto':'📷 Tomar foto'}<input type="file" accept="image/*" capture="environment" id="rFoto" class="hidden"></label>${r.foto?`<img class="photo sm" style="flex:0 0 96px" src="${r.foto}" alt="">`:''}</div>
    <label>Ubicación</label>
    <button type="button" class="btn y" id="btnGPS" style="width:100%">📍 Estoy junto a mi vehículo: guardar GPS</button>
    <div id="gpsRes">${r.err?`<div class="notfound">${esc(r.err)}</div>`:r.pos?(dentroMercado(r.pos)?`<div class="found"><b style="font-size:20px">${esc(lugar(r.pos).zona)}</b> · ${esc(lugar(r.pos).cerca)} · ±${r.pos.acc} m${r.pos.acc>25?'<br><b>La señal es débil.</b> Si puedes, espera unos segundos y vuelve a tocar el botón.':''}${enPlano(r.pos)?'<br><span class="hint">Si el punto no está bien, toca el mapa para corregirlo.</span>':''}</div>`:'<div class="notfound">Estás fuera del Mercado Mayor de Coche. La app solo funciona dentro del mercado.</div>'):''}</div>
    <div class="row" style="margin-top:16px">${c&&c.lat!=null?'<button class="btn o" type="button" id="cancelReg">Cancelar</button>':''}<button class="btn y" type="submit">Guardar y empezar a comprar</button></div></form></div>
   <div>${mapSVG({id:'pick',pick:!!r.pos,pin:r.pos,zoom:r.pos&&enPlano(r.pos)?[XY(r.pos)]:null,minW:560})}</div></div>`}

/* ===================== Acciones ===================== */
const $=id=>document.getElementById(id);
async function carretilleroPorNum(num,nombre){let k=carrPorNum(num);if(!k){k={id:'K'+num,num,nombre:nombre||'',creado:Date.now()};await guardar('carretillero',k);log(`Nuevo carretillero registrado: #${num}${nombre?' '+nombre:''}`)}else if(nombre&&!k.nombre){k={...k,nombre};await guardar('carretillero',k)}return k}
async function procesarScanFicha(){const t=await escanear('Escanea la ficha','El QR impreso en la ficha de entrega');if(!t)return null;const p=parseCodigo(t);if(!p||p.tipo!=='f'){toast('Ese código no es una ficha de CargaYa');return null}return p}
const bind={
  inicio(){
    document.querySelectorAll('[data-rol]').forEach(b=>b.onclick=()=>{rolElegido=b.dataset.rol;render()});
    if($('atras'))$('atras').onclick=()=>{rolElegido=null;render()};
    if($('fYo'))$('fYo').onsubmit=async e=>{e.preventDefault();const r=rolElegido;
      if(r==='admin'){if($('yClave').value!==String(CFG.CLAVE_ADMIN)){toast('Clave incorrecta');return}setME({rol:'admin',id:'admin',nombre:'Administración'});rolElegido=null;view='mercado';render();return}
      const nombre=$('yNombre').value.trim(),tel=$('yTel').value.trim();
      if(r==='comprador'){const p=normPlaca($('yPlaca').value);if(p.length<6){toast('Revisa la placa');return}
        const prev=comp(p);setME({rol:'comprador',id:p,nombre,tel});if(prev){await guardar('comprador',{...prev,nombre,tel,activo:true})}rolElegido=null;reg=null;render();return}
      const id=nuevoId('V');await guardar('vendedor',{id,nombre,tel,creado:Date.now()});setME({rol:'vendedor',id,nombre});log(`Se registró el vendedor ${nombre}`);rolElegido=null;render()};
  },
  mercado(){},
  zonas(){
    const medir=async(nombre,id)=>{zonaMidiendo=nombre;render();try{const f=await mejorFix(20000);const zid=id||nombre.toUpperCase();
      await guardar('zona',{id:zid,nombre:nombre.toUpperCase(),lat:f.lat,lng:f.lng,acc:f.acc,t:Date.now()});log(`Zona ${nombre.toUpperCase()} guardada (±${f.acc} m)`);toast(`Zona ${nombre.toUpperCase()} guardada ±${f.acc} m`)}catch(e){toast(errGPS(e))}zonaMidiendo=null;render()};
    $('zGuardar').onclick=()=>{const n=$('zNombre').value.trim().toUpperCase().replace(/\s+/g,'');if(!n){toast('Escribe el nombre del cartel');return}if(S.zona[n]&&!S.zona[n].baja&&!confirmarSimple(n))return;medir(n)};
    document.querySelectorAll('[data-zrem]').forEach(b=>b.onclick=()=>{const z=S.zona[b.dataset.zrem];medir(z.nombre,z.id)});
    document.querySelectorAll('[data-zdel]').forEach(b=>b.onclick=async()=>{const z=S.zona[b.dataset.zdel];if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Toca otra vez para quitar';return}
      await guardar('zona',{...z,baja:true});log(`Zona ${z.nombre} quitada`);render()});
  },
  carretilleros(){
    $('kScan').onclick=async()=>{const t=await escanear('Escanea el carnet','El QR del carnet del carretillero');const p=parseCodigo(t);if(p&&p.tipo==='k'){$('kNum').value=p.num;$('kNom').value=carrPorNum(p.num)?.nombre||'';$('kNom').focus()}else if(t)toast('Ese código no es un carnet de CargaYa')};
    $('kAdd').onclick=async()=>{const n=$('kNum').value.replace(/\D/g,'');if(!n){toast('Falta el número');return}const num=pad(n,2);const nom=$('kNom').value.trim();
      const k=carrPorNum(num);if(k)await guardar('carretillero',{...k,nombre:nom||k.nombre});else await carretilleroPorNum(num,nom);$('kNum').value='';$('kNom').value='';toast(`Carretillero #${num} guardado`);render()};
  },
  imprimir(){
    $('pfGo').onclick=async()=>{await cargarQRlib();const desde=Math.max(1,+$('pfDesde').value||1),cant=Math.min(400,Math.max(1,+$('pfCant').value||8));let h='<div class="hoja-fichas">';
      for(let i=0;i<cant;i++){const n=desde+i,num=pad(n,4),cod=codFicha(n);h+=`<div class="ficha"><div class="fh"><b>CargaYa</b> · Ficha de entrega</div><div class="fn">N° ${num}</div><img src="${qrImg(urlFicha(num,cod),220)}" alt=""><div class="fc">código ${cod}</div>
        <div class="fl">Zona: ________</div><div class="fl">Placa: ______________</div><div class="fl">Bultos: _____</div><div class="fp">Comprador: escanea este código para confirmar que recibiste.</div></div>`}
      await imprimir(h+'</div>')};
    $('pkGo').onclick=async()=>{await cargarQRlib();const desde=Math.max(1,+$('pkDesde').value||1),cant=Math.min(200,Math.max(1,+$('pkCant').value||1));let h='<div class="hoja-carnets">';
      for(let i=0;i<cant;i++){const num=pad(desde+i,2);h+=`<div class="carnet"><div class="cn">#${num}</div><img src="${qrImg(urlCarnet(num),200)}" alt=""><div class="ct">CARRETILLERO<br><span>Mercado Mayor de Coche</span></div></div>`}
      await imprimir(h+'</div>')};
    $('pzGo').onclick=()=>{const zs=$('pzLista').value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);imprimir(zs.map(z=>`<div class="cartel"><div class="cz">ZONA</div><div class="cn2">${esc(z)}</div><div class="cb">CargaYa · Mercado Mayor de Coche</div></div>`).join(''))};
  },
  calibrar(){
    const medir=async(id,nombre,nota)=>{calMidiendo=id;render();try{const f=await mejorFix(20000);await guardar('calibracion',{id,nombre,nota,lat:f.lat,lng:f.lng,acc:f.acc,t:Date.now()});log(`Calibración: ${nombre} medido (±${f.acc} m)`);toast(`Guardado ±${f.acc} m`)}catch(e){toast(errGPS(e))}calMidiendo=null;render()};
    document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{const p=PUNTOS_CAL.find(x=>x.id===b.dataset.cal);medir(p.id,p.nombre,$('nota-'+p.id).value.trim())});
    if($('calOtro'))$('calOtro').onclick=()=>{const n=$('calNombre').value.trim();if(!n){toast('Escribe qué lugar es');return}medir('X'+Date.now().toString(36),n,'')};
    if($('calCopiar'))$('calCopiar').onclick=async()=>{try{await navigator.clipboard.writeText(calTexto());toast('Copiado')}catch(e){toast('No se pudo copiar')}};
  },
  vendedor(){
    const v=ME.rol==='vendedor'?vend(ME.id):L('vendedor')[0];if(!v)return;
    if(fichaVista){$('fvListo').onclick=()=>{fichaVista=null;render()};return}
    const keep=()=>{desp.placa=$('placa').value;desp.desc=$('desc').value;desp.bultos=$('bultos').value};
    $('vGPS').onclick=async()=>{$('vRes').innerHTML='<p class="hint">Leyendo GPS…</p>';try{const f=await mejorFix();if(!dentroMercado(f)){$('vRes').innerHTML='<div class="notfound">Estás fuera del mercado.</div>';return}
      await guardar('vendedor',{...v,lat:f.lat,lng:f.lng,acc:f.acc,gpsT:Date.now()});toast('Ubicación del camión guardada')}catch(e){$('vRes').innerHTML=`<div class="notfound">${esc(errGPS(e))}</div>`}};
    const pin=$('placa'),info=$('placaInfo');
    const mostrar=()=>{const p=normPlaca(pin.value);if(p.length<5){info.innerHTML='';return}const c=comp(p);
      info.innerHTML=c&&c.activo!==false&&c.lat!=null?`<div class="found carbox">${c.foto?`<img class="photo sm" src="${c.foto}" alt="">`:''}<div><span class="plate">${esc(c.id)}</span> ${esc(c.nombre)}<br>${esc(c.vehiculo)}<br><b class="loc" style="font-size:22px">${esc(lugar(c).zona)}</b><div class="hint">${esc(lugar(c).cerca)} · GPS ${hhmm(c.gpsT)}</div></div></div>`:`<div class="notfound">Esa placa no está registrada o no marcó su ubicación. Pídele al comprador que la marque en la app.</div>`};
    pin.oninput=mostrar;if(pin.value)mostrar();
    if($('dScanK'))$('dScanK').onclick=async()=>{keep();const t=await escanear('Escanea el carnet','El QR del carnet del carretillero');const p=parseCodigo(t);
      if(p&&p.tipo==='k'){const k=await carretilleroPorNum(p.num);desp.k=k.id;render()}else if(t)toast('Ese código no es un carnet')};
    if($('dNumK'))$('dNumK').onchange=async()=>{keep();const n=$('dNumK').value.replace(/\D/g,'');if(!n)return;const k=await carretilleroPorNum(pad(n,2));desp.k=k.id;setTimeout(render,0)};
    if($('kQuitar'))$('kQuitar').onclick=e=>{e.preventDefault();keep();desp.k=null;render()};
    if($('dScanF'))$('dScanF').onclick=async()=>{keep();const p=await procesarScanFicha();if(p){desp.f=p;render()}};
    if($('dNumF'))$('dNumF').onchange=()=>{keep();const n=$('dNumF').value.replace(/\D/g,'');if(!n)return;desp.f={tipo:'f',num:pad(n,4),cod:null};setTimeout(render,0)};
    if($('fQuitar'))$('fQuitar').onclick=e=>{e.preventDefault();keep();desp.f=null;render()};
    $('fDesp').onsubmit=async e=>{e.preventDefault();keep();const p=normPlaca(desp.placa),c=comp(p);if(!c||c.lat==null){toast('Placa no registrada');return}
      if(!desp.k){toast('Falta el carretillero: escanea su carnet o escribe su número');return}
      if(!desp.f){toast('Falta la ficha: escanéala o escribe su número');return}
      const usada=L('despacho').find(d=>d.ficha&&d.ficha.num===desp.f.num&&d.estado==='en_ruta');if(usada){toast(`La ficha ${desp.f.num} ya está en uso`);return}
      const id=nuevoId('D');const d={id,vendedor:v.id,placa:p,desc:desp.desc.trim(),bultos:+desp.bultos||1,carretillero:desp.k,ficha:{num:desp.f.num,cod:desp.f.cod},estado:'en_ruta',t:{creado:Date.now()},verif:null};
      desp={};fichaVista=id;await guardar('despacho',d);const k=carr(d.carretillero);log(`${v.nombre} despachó ficha ${d.ficha.num} (${d.bultos} bultos) a ${p} en ${lugar(c).zona} con el carretillero #${k?.num}`);render()};
    document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{fichaVista=b.dataset.ver;render()});
    document.querySelectorAll('[data-vok]').forEach(b=>b.onclick=async()=>{if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Toca otra vez para confirmar';return}await confirmar(S.despacho[b.dataset.vok],'vendedor')});
  },
  comprador(){
    const c=ME.rol==='comprador'?comp(ME.id):compradoresActivos()[0];
    if(ME.rol==='comprador'&&(!c||c.lat==null||reg)){
      const keep=()=>{reg.veh=$('rVeh').value;reg.ref=$('rRef').value};
      fotoInput($('rFoto'),url=>{keep();reg.foto=url;render()});
      $('btnGPS').onclick=async()=>{keep();reg.err=null;reg.ocupado=true;$('gpsRes').innerHTML='<p class="hint">Leyendo GPS del teléfono… (hasta 12 segundos)</p>';
        try{reg.pos=await mejorFix()}catch(e){reg.err=errGPS(e)}reg.ocupado=false;render()};
      const svg=$('pick');if(svg&&reg.pos)svg.onclick=ev=>{keep();const p=svgPoint(svg,ev);if(!dentroMercado(p)){toast('Fuera del mercado');return}reg.pos={...p,acc:5,manual:true};render()};
      if($('cancelReg'))$('cancelReg').onclick=()=>{reg=null;render()};
      $('fReg').onsubmit=async e=>{e.preventDefault();keep();if(!reg.pos){toast('Primero guarda el GPS junto al vehículo');return}if(!dentroMercado(reg.pos)){toast('Fuera del mercado');return}
        const obj={...(c||{}),id:ME.id,nombre:ME.nombre,tel:c?.tel||ME.tel||'',vehiculo:reg.veh.trim(),ref:reg.ref.trim(),lat:reg.pos.lat,lng:reg.pos.lng,acc:reg.pos.acc,gpsT:Date.now(),
          llegada:c?.llegada&&c.activo!==false?c.llegada:Date.now(),foto:reg.foto||null,activo:true};
        reg=null;await guardar('comprador',obj);log(`${obj.id} (${obj.nombre}, ${obj.vehiculo}) marcó su vehículo en ${locTxt(obj)}`);toast('Vehículo guardado')};
      return}
    if(!c)return;
    if($('regps'))$('regps').onclick=async()=>{$('cRes').innerHTML='<p class="hint">Leyendo GPS…</p>';try{const f=await mejorFix();if(!dentroMercado(f)){$('cRes').innerHTML='<div class="notfound">Estás fuera del mercado.</div>';return}
      await guardar('comprador',{...c,lat:f.lat,lng:f.lng,acc:f.acc,gpsT:Date.now()});log(`${c.id} actualizó su ubicación: ${lugar(f).zona}`);toast('Ubicación actualizada')}catch(e){$('cRes').innerHTML=`<div class="notfound">${esc(errGPS(e))}</div>`}};
    if($('corr'))$('corr').onclick=()=>{corrigiendo={lat:c.lat,lng:c.lng,acc:c.acc};render()};
    if($('cancelCorr'))$('cancelCorr').onclick=()=>{corrigiendo=null;render()};
    if($('okCorr'))$('okCorr').onclick=async()=>{const p=corrigiendo;corrigiendo=null;await guardar('comprador',{...c,lat:p.lat,lng:p.lng,acc:5,gpsT:Date.now()});log(`${c.id} corrigió su ubicación en el mapa`);toast('Ubicación guardada')};
    const svg=$('pick');if(svg)svg.onclick=ev=>{const p=svgPoint(svg,ev);if(!dentroMercado(p)){toast('Fuera del mercado');return}corrigiendo={...p,acc:5};render()};
    if($('meVoy'))$('meVoy').onclick=async()=>{await guardar('comprador',{...c,activo:false});log(`${c.id} se fue del mercado`);setME(null);render()};
    $('cScanF').onclick=async()=>{const p=await procesarScanFicha();if(!p)return;fichaURL=p;render()};
    document.querySelectorAll('[data-sinf]').forEach(b=>b.onclick=async()=>{if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Toca otra vez para confirmar';return}await confirmar(S.despacho[b.dataset.sinf],'boton')});
    document.querySelectorAll('[data-recl]').forEach(b=>b.onclick=()=>{fichaURL={tipo:'f',num:S.despacho[b.dataset.recl].ficha?.num,cod:null};render()});
  }
};
function confirmarSimple(n){toast(`La zona ${n} ya existe: usa "Medir de nuevo" en la lista`);return false}

/* ===================== Arranque ===================== */
(async()=>{render();await cargar();cargado=true;
  if(ONLINE&&conexion!=='error'&&ME&&ME.rol==='vendedor'&&!S.vendedor[ME.id]){setME(null);toast('Tu registro no está en la base: elige tu rol de nuevo')}
  if(kURL&&!fichaURL){const k=carrPorNum(kURL.num);toast(k?`Carretillero #${k.num} ${k.nombre||''}`:`Carnet #${kURL.num} (todavía sin registrar)`)}
  if(conexion==='conectando')conexion=ONLINE?'en línea':'local';
  render();vaciarCola()})();
setInterval(()=>{if(ME)pedirRender()},30000);

</script>
