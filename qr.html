<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CargaYa · Códigos QR para imprimir</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f4ee;color:#16181c}
.bar{padding:16px;text-align:center}
button{font:inherit;font-weight:700;padding:12px 20px;border:0;border-radius:10px;background:#ffc400;cursor:pointer}
.hojas{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:0 16px 30px}
.hojas img{width:min(100%,360px);border:1px solid #e2e0d8;border-radius:12px;background:#fff}
@media print{.bar{display:none}body{background:#fff}.hojas{display:block;padding:0}.hojas img{display:block;width:16cm;margin:1cm auto;border:0;page-break-after:always}}
</style></head><body>
<div class="bar"><p>Un código por rol. Cada uno se imprime en su propia hoja.</p><button onclick="print()">Imprimir</button></div>
<div class="hojas">
<img src="qr/cargaya-qr-vendedor.png" alt="QR para vendedores">
<img src="qr/cargaya-qr-comprador.png" alt="QR para compradores">
<img src="qr/cargaya-qr-carretillero.png" alt="QR para carretilleros">
</div></body></html>
